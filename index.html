<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>OpenAI Chat Streaming - Markdown</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
		<style>
			html,
			body {
				height: 100%;
				width: 100%;
				margin: 0;
				padding: 0;
				background: #f8f9fa;
			}
			.chat-window {
				height: 100vh;
				display: flex;
				flex-direction: column;
				background: #fff;
			}
			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				border-bottom: 1px solid #eee;
				scroll-behavior: smooth;
			}
			.message span {
				display: inline-block;
				padding: 0.5rem 0.75rem;
				border-radius: 1rem;
				margin: 0.375rem 0;
				max-width: 80%;
				word-break: break-word;
			}
			.message.user span {
				background: #0d6efd;
				color: #fff;
			}
			.message.openai span {
				background: #e9ecef;
				color: #333;
			}
			.chat-id-tag {
				font-size: 0.75rem;
				color: #888;
				font-family: monospace;
				background: #eee;
				padding: 2px 7px;
				border-radius: 12px;
				margin-left: 0.5rem;
			}
			.model-dropdown{
				position:absolute;
				max-height:200px;
				overflow-y:auto;
				z-index:1000;
				border:1px solid #ccc;
				background:white;
				margin-top:2px;
				display:none;
			}
			.model-option{padding:8px;cursor:pointer;}
			.speed-indicator{font-size:0.85em;color:#888;padding-left:1em;}
			code,pre{font-family:'Fira Mono','Consolas',monospace;background:#f1f3f5;border-radius:4px;padding:2px 6px;}
			.settings-panel{display:none;border-bottom:1px solid #eee;padding:16px;background:#f7f7f7;}.settings-panel.show{display:block;}
			@media (max-width:600px){header{flex-wrap:wrap;gap:5px;}#headerTitle{width:100%;}.chat-id-tag{display:none;}}
		</style>
	</head>

	<body>
		<div class="chat-window">
			<header
				class="p-3 border-bottom d-flex align-items-center justify-content-between"
			>
				<span class="fw-bold" id="headerTitle">
					Chat OpenAI <small class="text-secondary">Streaming Markdown</small>
					<span
						id="chatIdTag"
						class="chat-id-tag"
						title="Conversation ID"
					></span>
				</span>
				<div class="d-flex align-items-center">
					<select
						id="chatHistorySelect"
						class="form-select form-select-sm me-2"
						style="width: auto"
					>
						<option value="">Historial...</option>
					</select>
					<!-- Botón con estilo Bootstrap -->
					<button
						class="btn btn-success btn-sm me-2"
						id="newChatBtn"
						title="New Chat"
					>
						New chat
					</button>
					<button
						class="btn btn-secondary btn-sm me-2"
						id="generateTitleBtn"
						title="Generate title"
					>
						Generate title
					</button>
					<span class="settings-toggle" id="settingsToggle" title="Settings"
						>&#9881;</span
					>
				</div>
			</header>
			<section class="settings-panel" id="settingsPanel">
				<form id="settingsForm" autocomplete="on">
					<div class="mb-2">
						<label class="form-label">Base URL (up to /v1)</label>
						<input type="text" class="form-control" id="urlBase" required />
					</div>
					<div class="mb-2">
						<label class="form-label">API Key</label>
						<input type="text" class="form-control" id="apiKey" required />
					</div>
					<div class="mb-2">
						<label class="form-label">Model</label>
						<input type="text" class="form-control" id="model" required autocomplete="off" />
						<div id="modelDropdown" class="model-dropdown"></div>
					</div>
					<div class="mb-2">
						<label class="form-label">System prompt</label>
						<textarea
							class="form-control"
							id="systemPrompt"
							rows="2"
							placeholder="Example: You are a helpful and concise assistant."
						></textarea>
						<small class="text-secondary">Controls AI behavior.</small>
					</div>
					<button type="submit" class="btn btn-primary btn-sm w-100">
						Save settings
					</button>
				</form>
			</section>
			<main class="chat-messages" id="chatMessages"></main>
			<div id="imagePreview" class="px-3 pb-2" style="display:none">
				<div class="position-relative d-inline-block">
					<img id="imgPreview" style="max-height:100px;border-radius:8px">
					<button type="button" class="btn-close position-absolute top-0 start-100 translate-middle bg-white border rounded-circle" id="clearImg" style="padding: 5px;"></button>
				</div>
			</div>
			<form class="d-flex p-3 gap-2" id="chatForm" autocomplete="off">
				<input type="file" id="imageInput" accept="image/*" style="display:none">
				<button class="btn btn-outline-secondary btn-sm" type="button" id="imageBtn" title="Upload Image" style="padding: 2px 6px; font-size: 0.85rem;">📎</button>
				<textarea
					class="form-control flex-grow-1"
					id="userInput"
					placeholder="Type your message..."
					required
					rows="2"
					style="resize: vertical"
				></textarea>
				<button class="btn btn-primary flex-shrink-0" type="submit">
					Send
				</button>
			</form>
		</div>
		<script type="module">
			const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
			const load = k => JSON.parse(localStorage.getItem(k));

			const generateChatId = () =>
				globalThis.crypto?.randomUUID?.() ||
				Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
			const getOrCreateChatId = () => {
				const params = new URLSearchParams(location.search);
				let chatId = params.get('chat');
				if (!chatId) {
					chatId = generateChatId();
					params.set('chat', chatId);
					history.replaceState(null, '', '?' + params.toString());
				}
				return chatId;
			};
			const chatId = getOrCreateChatId();
			document.getElementById('chatIdTag').textContent = chatId;

			const settingsPanel = document.getElementById('settingsPanel');
			const settingsToggle = document.getElementById('settingsToggle');
			const settingsForm = document.getElementById('settingsForm');
			const urlBaseInput = document.getElementById('urlBase');
			const apiKeyInput = document.getElementById('apiKey');
			const modelInput = document.getElementById('model');
			const modelDropdown = document.getElementById('modelDropdown');
			const systemPromptInput = document.getElementById('systemPrompt');
			const chatMessages = document.getElementById('chatMessages');
			const chatForm = document.getElementById('chatForm');
			const userInput = document.getElementById('userInput');
			const newChatBtn = document.getElementById('newChatBtn');
			const generateTitleBtn = document.getElementById('generateTitleBtn');
			const headerTitle = document.getElementById('headerTitle');
			const chatHistorySelect = document.getElementById('chatHistorySelect');
			const imageInput = document.getElementById('imageInput'), imageBtn = document.getElementById('imageBtn'), imagePreview = document.getElementById('imagePreview'), imgPreview = document.getElementById('imgPreview'), clearImg = document.getElementById('clearImg');

			imageBtn.onclick = () => imageInput.click();
			imageInput.onchange = () => {
				const f = imageInput.files[0];
				if (f) {
					const r = new FileReader();
					r.onload = e => { imgPreview.src = e.target.result; imagePreview.style.display = 'block'; };
					r.readAsDataURL(f);
				}
			};
			clearImg.onclick = () => { imageInput.value = ''; imagePreview.style.display = 'none'; };

			let isSettingTitle = false;
			const SET_TITLE_PROMPT = '--set-title: Generate a very short (max 5 words) and concise title for this conversation. Respond only with the title, no other text.';

			generateTitleBtn.onclick = () => {
				userInput.value = SET_TITLE_PROMPT;
				userInput.focus();
			};

			const configKey = `chatConfig-${chatId}`;
			const loadConfig = () => {
				const config = load(configKey) ?? {};
				urlBaseInput.value = config.urlBase ?? 'https://api.openai.com/v1';
				apiKeyInput.value = config.apiKey ?? '';
				modelInput.value = config.model ?? 'gpt-4o-mini';
				systemPromptInput.value = config.systemPrompt ?? '';
			};
			loadConfig();

			settingsToggle.onclick = () => settingsPanel.classList.toggle('show');

			const loadModels = async () => {
				const e = urlBaseInput.value.trim(), k = apiKeyInput.value.trim();
				if (!e || !k) return;
				let b = e.replace(/\/chat\/completions$/, '').replace(/\/v1$/, '');if (!b.includes('/v1')) b += '/v1';
				const r = await fetch(`${b}/models`, {headers: {'Authorization': `Bearer ${k}`, 'Content-Type': 'application/json'}});
				const d = await r.json(), m = d.data || d.models || [];
				modelDropdown.innerHTML = '';
				m.forEach(model => {
					const opt = Object.assign(document.createElement('div'), {
						textContent: model.id || model.name || model,
						className: 'model-option',
						onclick: () => {modelInput.value = model.id || model.name || model;modelDropdown.style.display = 'none';}
					});
					modelDropdown.appendChild(opt);
				});
				const {bottom, left, width} = modelInput.getBoundingClientRect();
				Object.assign(modelDropdown.style, {
					display: 'block',
					top: `${bottom + window.scrollY}px`,
					left: `${left + window.scrollX}px`,
					width: `${width}px`
				});
			};

			modelInput.addEventListener('click', loadModels);

			modelInput.addEventListener('blur', () => {
				setTimeout(() => modelDropdown.style.display = 'none', 150);
			});

			settingsForm.onsubmit = e => {
				e.preventDefault();
				save(configKey, {
					urlBase: urlBaseInput.value.trim(),
					apiKey: apiKeyInput.value.trim(),
					model: modelInput.value.trim(),
					systemPrompt: systemPromptInput.value.trim(),
				});
				settingsPanel.classList.remove('show');
			};

			let conversation = [];
			const saveConversation = () => save(`chatHistory-${chatId}`, conversation);
			const restoreHistory = () => {
				conversation = load(`chatHistory-${chatId}`) ?? [];
				chatMessages.innerHTML = '';
				for (const m of conversation) addMessage(m.content, m.role === 'user' ? 'user' : 'openai');
			};

			const renderMarkdown = text => marked.parse(text);
			const addMessage = (content, sender) => {
				const h = Array.isArray(content)
					? content.reduce((acc, c) =>
						c.type === 'text'
							? acc + (sender === 'openai' ? renderMarkdown(c.text) : c.text)
							: acc + `<img src="${c.image_url.url}" style="max-width:100%;max-height:300px;display:block;margin-top:5px;border-radius:8px">`, '')
					: sender === 'openai' ? renderMarkdown(content) : content;
				chatMessages.insertAdjacentHTML('beforeend', `<div class="message ${sender}"><span>${h}</span></div>`);
				chatMessages.lastChild.scrollIntoView({ block: 'end' });
			};

			restoreHistory();

			const streamOpenAI = async ({ urlBase, apiKey, model, conversation, onChunk, onDone, onError }) => {
				const start = performance.now();
				let text = '', tokens = 0;
				try {
					const res = await fetch(`${urlBase}/chat/completions`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
						body: JSON.stringify({ model, messages: conversation, stream: true, max_tokens: 32768 }),
					});
					const reader = res.body.getReader(), decoder = new TextDecoder();
					let buffer = '';
					while (true) {
						const { value, done } = await reader.read();
						if (done) break;
						buffer += decoder.decode(value, { stream: true });
						const lines = buffer.split('\n');
						buffer = lines.pop();
						for (const l of lines) {
							if (!l.trim().startsWith('data:')) continue;
							const d = l.slice(5).trim();
							if (d === '[DONE]') return onDone(text, tokens, (performance.now() - start) / 1000);
							const delta = JSON.parse(d).choices[0]?.delta?.content;
							if (delta) { text += delta; tokens++; onChunk(text, tokens, (performance.now() - start) / 1000); }
						}
					}
				} catch { onError?.(); }
			};

			const prepareConversation = config => {
				const sys = config.systemPrompt?.trim();
				const base = conversation.map(m => ({ ...m }));
				return sys && base[0]?.role !== 'system' ? [{ role: 'system', content: sys }, ...base] : base;
			};

			let messageCounter = 0;
			chatForm.onsubmit = async e => {
				e.preventDefault();
				const text = userInput.value.trim();
				if (!text && !imageInput.files[0]) return;
				isSettingTitle = text.startsWith('--set-title');

				let imgData = null;
				if (imageInput.files[0]) imgData = imgPreview.src;

				const userMsg = imgData ? { role: 'user', content: [{ type: 'text', text: text || 'Analyze this image' }, { type: 'image_url', image_url: { url: imgData } }] } : { role: 'user', content: text };

				addMessage(userMsg.content, 'user');
				userInput.value = '';
				imageInput.value = '';
				imagePreview.style.display = 'none';

				const config = load(configKey) ?? {};
				conversation.push(userMsg);
				saveConversation();
				const convSend = prepareConversation(config);
				messageCounter++;
				const replyId = `reply-${messageCounter}`, speedId = `speed-${messageCounter}`;
				addMessage(`<span id="${replyId}"></span><br><small id="${speedId}" class="speed-indicator"></small>`, 'openai');
				const replyElem = document.getElementById(replyId), speedElem = document.getElementById(speedId), msgDiv = chatMessages.lastChild;
				await streamOpenAI({
					urlBase: config.urlBase ?? 'https://api.openai.com/v1',
					apiKey: config.apiKey ?? '',
					model: config.model ?? 'gpt-4o-mini',
					conversation: convSend,
					onChunk: (content, tokens, secs) => {
						if (tokens % 10 === 0 || tokens === 1) replyElem.innerHTML = renderMarkdown(content);
						if (tokens > 0) speedElem.innerText = `Tokens: ${tokens} • Speed: ${(tokens / (secs || 1)).toFixed(2)} tks/sec`;
						msgDiv.scrollIntoView({ block: 'end' });
					},
					onDone: async (content, tokens, secs) => {
						if (content) { conversation.push({ role: 'assistant', content }); await saveConversation(); }
						replyElem.innerHTML = renderMarkdown(content);
						speedElem.innerText = `Done. Tokens: ${tokens}, Max speed: ${(tokens / (secs || 1)).toFixed(2)} tks/sec`;
						if (isSettingTitle) {
							const title = (content || '').trim().replace(/\r?\n/g, ' ').replace(/[^\p{L}\p{N}\p{Extended_Pictographic} \-]/gu, '').trim().substring(0, 50) || 'New Chat';
							document.title = title;
							headerTitle.innerHTML = `${title} <small class="text-secondary">Streaming Markdown</small><span id="chatIdTag" class="chat-id-tag" title="Conversation ID">${chatId}</span>`;
							localStorage.setItem(`chatTitle-${chatId}`, title);
							isSettingTitle = false;
						}
					},
					onError: () => { chatMessages.lastChild.remove(); addMessage('Connection error (streaming failed).', 'openai'); },
				});
			};

			const savedTitle = localStorage.getItem(`chatTitle-${chatId}`);
			if (savedTitle) {
				document.title = savedTitle;
				headerTitle.innerHTML = `${savedTitle} <small class="text-secondary">Streaming Markdown</small><span id="chatIdTag" class="chat-id-tag" title="Conversation ID">${chatId}</span>`;
			}

			newChatBtn.onclick = () => {
				const newId = generateChatId();
				save(`chatConfig-${newId}`, { urlBase: urlBaseInput.value.trim(), apiKey: apiKeyInput.value.trim(), model: modelInput.value.trim(), systemPrompt: systemPromptInput.value.trim() });
				window.open(`?chat=${newId}`, '_blank');
			};

			Object.keys(localStorage).filter(k => k.startsWith('chatTitle-')).forEach(k => {
				const id = k.slice(10), title = localStorage.getItem(k) || 'Sin título', m = load(`chatConfig-${id}`)?.model || '';
				chatHistorySelect.insertAdjacentHTML('beforeend', `<option value="${id}">${title} (${m})</option>`);
			});

			chatHistorySelect.onchange = e => e.target.value && (location.search = '?chat=' + e.target.value);

			userInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatForm.requestSubmit(); } };
		</script>
	</body>
</html>
