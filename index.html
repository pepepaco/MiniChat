<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>OpenAI Chat Streaming - Markdown</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Bootstrap (latest) -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<!-- Marked.js for Markdown support -->
		<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
		<!-- Optional: Enable if you need sanitization
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.2/dist/purify.min.js"></script>
  -->
		<style>
			/* Unified minimal styles (match app.js) */
			html,
			body {
				height: 100%;
				width: 100%;
				margin: 0;
				padding: 0;
				background: #f8f9fa;
			}
			.chat-window {
				height: 100vh;
				display: flex;
				flex-direction: column;
				background: #fff;
			}
			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				border-bottom: 1px solid #eee;
				scroll-behavior: smooth;
			}
			.message span {
				display: inline-block;
				padding: 0.5rem 0.75rem;
				border-radius: 1rem;
				margin: 0.375rem 0;
				max-width: 80%;
				word-break: break-word;
			}
			.message.user span {
				background: #0d6efd;
				color: #fff;
			}
			.message.openai span {
				background: #e9ecef;
				color: #333;
			}
			.chat-id-tag {
				font-size: 0.75rem;
				color: #888;
				font-family: monospace;
				background: #eee;
				padding: 2px 7px;
				border-radius: 12px;
				margin-left: 0.5rem;
			}
			.speed-indicator {
				font-size: 0.85em;
				color: #888;
				padding-left: 1em;
			}
			code,
			pre {
				font-family: 'Fira Mono', 'Consolas', monospace;
				background: #f1f3f5;
				border-radius: 4px;
				padding: 2px 6px;
			}
			.settings-panel {
				display: none;
				border-bottom: 1px solid #eee;
				padding: 16px;
				background: #f7f7f7;
			}
			.settings-panel.show {
				display: block;
			}
			/* Reduce reglas responsivas repetitivas; confiar en Bootstrap utilities */
		</style>
	</head>

	<body>
		<div class="chat-window">
			<header
				class="p-3 border-bottom d-flex align-items-center justify-content-between"
			>
				<span class="fw-bold" id="headerTitle">
					Chat OpenAI <small class="text-secondary">Streaming Markdown</small>
					<span
						id="chatIdTag"
						class="chat-id-tag"
						title="Conversation ID"
					></span>
				</span>
				<div>
					<!-- Botón con estilo Bootstrap -->
					<button
						class="btn btn-success btn-sm me-2"
						id="newChatBtn"
						title="New Chat"
					>
						New chat
					</button>
					<button
						class="btn btn-secondary btn-sm me-2"
						id="generateTitleBtn"
						title="Generate title"
					>
						Generate title
					</button>
					<span class="settings-toggle" id="settingsToggle" title="Settings"
						>&#9881;</span
					>
				</div>
			</header>
			<section class="settings-panel" id="settingsPanel">
				<form id="settingsForm" autocomplete="on">
					<div class="mb-2">
						<label class="form-label">Base URL (up to /v1)</label>
						<input type="text" class="form-control" id="urlBase" required />
					</div>
					<div class="mb-2">
						<label class="form-label">API Key</label>
						<input type="text" class="form-control" id="apiKey" required />
					</div>
					<div class="mb-2">
						<label class="form-label">Model</label>
						<input type="text" class="form-control" id="model" required />
					</div>
					<div class="mb-2">
						<label class="form-label">System prompt</label>
						<textarea
							class="form-control"
							id="systemPrompt"
							rows="2"
							placeholder="Example: You are a helpful and concise assistant."
						></textarea>
						<small class="text-secondary">Controls AI behavior.</small>
					</div>
					<button type="submit" class="btn btn-primary btn-sm w-100">
						Save settings
					</button>
				</form>
			</section>
			<main class="chat-messages" id="chatMessages"></main>
			<form class="d-flex p-3 gap-2" id="chatForm" autocomplete="off">
				<textarea
					class="form-control flex-grow-1"
					id="userInput"
					placeholder="Type your message..."
					required
					rows="2"
					style="resize: vertical"
				></textarea>
				<button class="btn btn-primary flex-shrink-0" type="submit">
					Send
				</button>
			</form>
		</div>
		<script type="module">
			// ----------- localStorage helpers --------
			const save = (key, value) =>
				localStorage.setItem(key, JSON.stringify(value));
			const load = key => JSON.parse(localStorage.getItem(key));

			// ----------- Chat ID management ----------
			const generateChatId = () =>
				globalThis.crypto?.randomUUID?.() ||
				Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
			const getOrCreateChatId = () => {
				const params = new URLSearchParams(location.search);
				let chatId = params.get('chat');
				if (!chatId) {
					chatId = generateChatId();
					params.set('chat', chatId);
					history.replaceState(null, '', '?' + params.toString());
				}
				return chatId;
			};
			const chatId = getOrCreateChatId();
			document.getElementById('chatIdTag').textContent = chatId;

			// ----------- DOM elements ---------------
			const settingsPanel = document.getElementById('settingsPanel');
			const settingsToggle = document.getElementById('settingsToggle');
			const settingsForm = document.getElementById('settingsForm');
			const urlBaseInput = document.getElementById('urlBase');
			const apiKeyInput = document.getElementById('apiKey');
			const modelInput = document.getElementById('model');
			const systemPromptInput = document.getElementById('systemPrompt');
			const chatMessages = document.getElementById('chatMessages');
			const chatForm = document.getElementById('chatForm');
			const userInput = document.getElementById('userInput');
			const newChatBtn = document.getElementById('newChatBtn');
			const generateTitleBtn = document.getElementById('generateTitleBtn');
			const headerTitle = document.getElementById('headerTitle');

			// flag mínimo para indicar que el próximo assistant response debe usarse como título
			let isSettingTitle = false;

			// El prompt especial (se inserta en el input cuando se pulsa el botón)
			const SET_TITLE_PROMPT =
				'--set-title: Generate a very short (max 5 words) and concise title for this conversation. Respond only with the title, no other text.';

			generateTitleBtn.addEventListener('click', () => {
				userInput.value = SET_TITLE_PROMPT;
				userInput.focus();
			});

			// ----------- Config management ----------
			const configKey = `chatConfig-${chatId}`;

			// Cargar configuración del chat actual, o valores por defecto
			const loadConfig = () => {
				const config = load(configKey) ?? {};
				urlBaseInput.value = config.urlBase ?? 'https://api.openai.com/v1';
				apiKeyInput.value = config.apiKey ?? '';
				modelInput.value = config.model ?? 'gpt-3.5-turbo';
				systemPromptInput.value = config.systemPrompt ?? '';
			};
			loadConfig();

			settingsToggle.addEventListener('click', () =>
				settingsPanel.classList.toggle('show'),
			);

			settingsForm.addEventListener('submit', e => {
				e.preventDefault();
				save(configKey, {
					urlBase: urlBaseInput.value.trim(),
					apiKey: apiKeyInput.value.trim(),
					model: modelInput.value.trim(),
					systemPrompt: systemPromptInput.value.trim(),
				});
				settingsPanel.classList.remove('show');
			});

			// ----------- Conversation history --------
			let conversation = [];
			const saveConversation = () => {
				save(`chatHistory-${chatId}`, conversation);
			};
			const restoreHistory = () => {
				conversation = load(`chatHistory-${chatId}`) ?? [];
				chatMessages.innerHTML = '';
				conversation.forEach(msg =>
					addMessage(msg.content, msg.role === 'user' ? 'user' : 'openai'),
				);
			};

			// ----------- Markdown & rendering -------
			const renderMarkdown = text => marked.parse(text);
			const addMessage = (content, sender) => {
				const div = document.createElement('div');
				div.className = `message ${sender}`;
				div.innerHTML = `<span>${
					sender === 'openai' ? renderMarkdown(content) : content
				}</span>`;
				chatMessages.appendChild(div);
				// Use the same approach as original working version
				div.scrollIntoView({ block: 'end' });
			};

			// ----------- OpenAI streaming -----------
			const streamOpenAI = async ({
				urlBase,
				apiKey,
				model,
				conversation,
				onChunk,
				onDone,
				onError,
			}) => {
				const headers = {
					'Content-Type': 'application/json',
					Authorization: `Bearer ${apiKey}`,
				};
				const startTime = performance.now();
				let lastText = '',
					tokenCount = 0;
				const response = await fetch(`${urlBase}/chat/completions`, {
					method: 'POST',
					headers,
					body: JSON.stringify({ model, messages: conversation, stream: true }),
				});
				const reader = response.body.getReader();
				const decoder = new TextDecoder();
				let buffer = '',
					done = false;
				while (!done) {
					const { value, done: doneReading } = await reader.read();
					if (doneReading) break;
					buffer += decoder.decode(value, { stream: true });
					const lines = buffer.split('\n');
					buffer = lines.pop();
					for (let line of lines) {
						const ltrim = line.trim();
						if (!ltrim.startsWith('data:')) continue;
						const jsonStr = ltrim.slice(5).trim();
						if (jsonStr === '[DONE]') {
							done = true;
							break;
						}
						const parsed = JSON.parse(jsonStr);
						const delta = parsed.choices[0]?.delta?.content ?? '';
						if (delta) {
							lastText += delta;
							tokenCount++;
							onChunk?.(
								lastText,
								tokenCount,
								(performance.now() - startTime) / 1000,
							);
						}
					}
				}
				onDone?.(lastText, tokenCount, (performance.now() - startTime) / 1000);
			};

			// ----------- Chat submission/stream -------
			restoreHistory();

			let messageCounter = 0;
			const handleChatSubmit = async e => {
				e.preventDefault();
				const text = userInput.value.trim();
				if (!text) return;

				// Si el mensaje comienza con --set-title activamos la bandera
				isSettingTitle = text.startsWith('--set-title');

				addMessage(text, 'user');
				userInput.value = '';

				const config = load(configKey) ?? {};
				const sysPrompt = config.systemPrompt || '';
				conversation.push({ role: 'user', content: text });
				saveConversation();

				let convSend = [...conversation];
				if (sysPrompt && !(convSend.length && convSend[0].role === 'system'))
					convSend = [{ role: 'system', content: sysPrompt }, ...convSend];

				messageCounter++;
				const replyId = `reply-${messageCounter}`;
				const speedId = `speed-${messageCounter}`;
				addMessage(
					`<span id="${replyId}"></span><br><small id="${speedId}" class="speed-indicator"></small>`,
					'openai',
				);
				const replyElem = document.getElementById(replyId);
				const speedElem = document.getElementById(speedId);
				const msgDiv = chatMessages.lastChild;

				await streamOpenAI({
					urlBase: config.urlBase ?? 'https://api.openai.com/v1',
					apiKey: config.apiKey ?? '',
					model: config.model ?? 'gpt-3.5-turbo',
					conversation: convSend,
					onChunk: (content, tokens, secs) => {
						if (tokens % 10 === 0 || tokens === 1)
							replyElem.innerHTML = renderMarkdown(content);
						if (tokens > 0)
							speedElem.innerText = `Tokens: ${tokens} • Speed: ${(
								tokens / (secs || 1)
							).toFixed(2)} tks/sec`;
						msgDiv.scrollIntoView({ block: 'end' });
					},
					onDone: async (content, tokens, secs) => {
						if (content) {
							conversation.push({ role: 'assistant', content });
							await saveConversation();
						}
						replyElem.innerHTML = renderMarkdown(content);
						speedElem.innerText = `Done. Tokens: ${tokens}, Max speed: ${(
							tokens / (secs || 1)
						).toFixed(2)} tks/sec`;

						// Si venimos de un --set-title usamos la respuesta como título
						if (isSettingTitle) {
							const raw = (content || '').trim();
							// limpiar: solo texto plano corto y sin saltos
							const title =
								raw
									.replace(/\r?\n/g, ' ')
									.replace(/[^a-zA-Z0-9 \-]/g, '')
									.trim()
									.substring(0, 50) || 'New Chat';
							document.title = title;
							// actualizar header (mantener pequeña etiqueta)
							headerTitle.innerHTML = `${title} <small class="text-secondary">Streaming Markdown</small><span id="chatIdTag" class="chat-id-tag" title="Conversation ID">${chatId}</span>`;
							// guardar título por chat
							localStorage.setItem(`chatTitle-${chatId}`, title);
							isSettingTitle = false;
						}
					},
					onError: () => {
						chatMessages.lastChild.remove();
						addMessage('Connection error (streaming failed).', 'openai');
					},
				});
			};
			chatForm.addEventListener('submit', handleChatSubmit);

			// Load saved title if exists (mover aquí para aplicar en header)
			const savedTitle = localStorage.getItem(`chatTitle-${chatId}`);
			if (savedTitle) {
				document.title = savedTitle;
				headerTitle.innerHTML = `${savedTitle} <small class="text-secondary">Streaming Markdown</small><span id="chatIdTag" class="chat-id-tag" title="Conversation ID">${chatId}</span>`;
			}

			// ----------- Start new chat -------------
			newChatBtn.addEventListener('click', () => {
				const newId = generateChatId();
				const thisConfig = {
					urlBase: urlBaseInput.value.trim(),
					apiKey: apiKeyInput.value.trim(),
					model: modelInput.value.trim(),
					systemPrompt: systemPromptInput.value.trim(),
				};
				save(`chatConfig-${newId}`, thisConfig);
				window.open(`?chat=${newId}`, '_blank');
			});

			// Enter = enviar, Shift+Enter = salto de línea
			userInput.addEventListener('keydown', e => {
				if (e.key === 'Enter' && !e.shiftKey) {
					e.preventDefault();
					chatForm.requestSubmit();
				}
				// Shift+Enter: default (salto de línea)
			});
		</script>
	</body>
</html>
