<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <title>OpenAI Chat Streaming - Markdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
   html,
   body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    background: #f8f9fa;
   }
   .chat-window {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
   }
   .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    border-bottom: 1px solid #eee;
    scroll-behavior: smooth;
   }
   .message span {
    display: inline-block;
    padding: 0.5rem 0.75rem;
    border-radius: 1rem;
    margin: 0.375rem 0;
    max-width: 80%;
    word-break: break-word;
    white-space: pre-wrap;
   }
   .message.user span {
    background: #0d6efd;
    color: #fff;
   }
   .message.openai span {
    background: #e9ecef;
    color: #333;
   }
   .chat-id-tag {
    font-size: 0.75rem;
    color: #888;
    font-family: monospace;
    background: #eee;
    padding: 2px 7px;
    border-radius: 12px;
    margin-left: 0.5rem;
   }
   code,
   pre {
    font-family: 'Fira Mono', 'Consolas', monospace;
    background: #f1f3f5;
    border-radius: 4px;
    padding: 2px 6px;
   }
   .settings-panel {
    display: none;
    border-bottom: 1px solid #eee;
    padding: 16px;
    background: #f7f7f7;
   }
   .settings-panel.show {
    display: block;
   }
   @media (max-width: 600px) {
    header {
     flex-wrap: wrap;
     gap: 5px;
    }
    #headerTitle {
     width: 100%;
    }
    .chat-id-tag {
     display: none;
    }
   }
  </style>
 </head>

 <body>
  <div class="chat-window">
   <header class="p-3 border-bottom d-flex align-items-center justify-content-between">
    <span class="fw-bold" id="headerTitle">
     Chat OpenAI
     <small class="text-secondary">Streaming Markdown</small>
     <span id="chatIdTag" class="chat-id-tag" title="Conversation ID"></span>
    </span>
    <div class="d-flex align-items-center">
     <select id="chatHistorySelect" class="form-select form-select-sm me-2" style="width: auto">
      <option value="">Historial...</option>
     </select>
     <button class="btn btn-success btn-sm me-2" id="newChatBtn" title="New Chat">New chat</button>
     <button class="btn btn-secondary btn-sm me-2" id="generateTitleBtn" title="Generate title">Generate title</button>
     <span class="settings-toggle" id="settingsToggle" title="Settings">&#9881;</span>
    </div>
   </header>
   <section class="settings-panel" id="settingsPanel">
    <form id="settingsForm" autocomplete="on">
     <div class="mb-2">
      <label class="form-label">Base URL (up to /v1)</label>
      <input type="text" class="form-control" id="urlBase" required />
     </div>
     <div class="mb-2">
      <label class="form-label">API Key</label>
      <input type="text" class="form-control" id="apiKey" required />
     </div>
     <div class="mb-2">
      <label class="form-label">Model</label>
      <input type="text" class="form-control" id="model" required />

     </div>
     <div class="mb-2">
      <label class="form-label">System prompt</label>
      <textarea class="form-control" id="systemPrompt" rows="2" placeholder="Example: You are a helpful and concise assistant."></textarea>
      <small class="text-secondary">Controls AI behavior.</small>
     </div>
     <button type="submit" class="btn btn-primary btn-sm w-100">Save settings</button>
    </form>
   </section>
   <main class="chat-messages" id="chatMessages"></main>
   <div id="imagePreview" class="px-3 pb-2" style="display: none">
    <div class="position-relative d-inline-block">
     <img id="imgPreview" style="max-height: 100px; border-radius: 8px" />
     <button type="button" class="btn-close position-absolute top-0 start-100 translate-middle bg-white border rounded-circle" id="clearImg" style="padding: 5px"></button>
    </div>
   </div>
   <form class="d-flex p-3 gap-2" id="chatForm" autocomplete="off">
    <textarea class="form-control flex-grow-1" id="userInput" placeholder="Type your message... (Paste images here)" required rows="2" style="resize: vertical"></textarea>
    <button class="btn btn-primary flex-shrink-0" type="submit">Send</button>
   </form>
  </div>
  <script type="module">
   const DB = 'm', V = 2, $ = id => document.getElementById(id);
   const openDB = () => new Promise((y, n) => {
    const r = indexedDB.open(DB, V);
    r.onsuccess = () => y(r.result);
    r.onupgradeneeded = () => ['data', 'imgs'].forEach(s => r.result.objectStoreNames.contains(s) || r.result.createObjectStore(s));
    r.onerror = () => n(r.error);
   });
   const db = async (s, mode, action, k, v) => {
    const d = await openDB(), t = d.transaction(s, mode), o = t.objectStore(s);
    return new Promise((y, n) => {
     const r = action === 'put' ? o.put(v, k) : o[action](k);
     r.onsuccess = () => y(r.result);
     r.onerror = () => n(r.error);
    });
   };
   const save = (k, v) => db('data', 'readwrite', 'put', k, JSON.stringify(v)),
    load = async k => JSON.parse(await db('data', 'readonly', 'get', k) || 'null'),
    saveImg = (k, v) => db('imgs', 'readwrite', 'put', k, v),
    loadImg = k => db('imgs', 'readonly', 'get', k);

   const chatId = (() => {
    const p = new URLSearchParams(location.search);
    let c = p.get('chat') || (crypto.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    if (!p.has('chat')) { p.set('chat', c); history.replaceState(null, '', '?' + p); }
    return c;
   })();
   $('chatIdTag').textContent = chatId;

   const settingsPanel = $('settingsPanel'), settingsToggle = $('settingsToggle'), settingsForm = $('settingsForm'),
    urlBaseInput = $('urlBase'), apiKeyInput = $('apiKey'), modelInput = $('model'), systemPromptInput = $('systemPrompt'),
    chatMessages = $('chatMessages'), chatForm = $('chatForm'), userInput = $('userInput'), newChatBtn = $('newChatBtn'),
    generateTitleBtn = $('generateTitleBtn'), headerTitle = $('headerTitle'), chatHistorySelect = $('chatHistorySelect'),
    imagePreview = $('imagePreview'), imgPreview = $('imgPreview'), clearImg = $('clearImg');

   const handleImg = f => {
    const r = new FileReader();
    r.onload = e => {
     const i = new Image();
     i.onload = () => {
      const c = document.createElement('canvas'), s = Math.min(1, 1024 / Math.max(i.width, i.height));
      c.width = i.width * s; c.height = i.height * s;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      imgPreview.src = c.toDataURL('image/jpeg', 0.5);
      imagePreview.style.display = 'block';
     };
     i.src = e.target.result;
    };
    r.readAsDataURL(f);
   };
   userInput.onpaste = e => { const f = Array.from(e.clipboardData.items).find(x => x.type.startsWith('image'))?.getAsFile(); if (f) handleImg(f); };
   clearImg.onclick = () => { imagePreview.style.display = 'none'; imgPreview.src = ''; };

   let isSettingTitle = false;
   generateTitleBtn.onclick = () => { userInput.value = '--set-title: Generate a short title (max 5 words). Respond only with the title.'; userInput.focus(); };

   const configKey = `chatConfig-${chatId}`, loadConfig = async () => {
    const c = await load(configKey) || {};
    urlBaseInput.value = c.urlBase || 'https://api.openai.com/v1';
    apiKeyInput.value = c.apiKey || '';
    modelInput.value = c.model || 'gpt-4o-mini';
    systemPromptInput.value = c.systemPrompt || '';
   };
   loadConfig();
   settingsToggle.onclick = () => settingsPanel.classList.toggle('show');
   settingsForm.onsubmit = e => {
    e.preventDefault();
    save(configKey, {urlBase: urlBaseInput.value.trim(), apiKey: apiKeyInput.value.trim(), model: modelInput.value.trim(), systemPrompt: systemPromptInput.value.trim()});
    settingsPanel.classList.remove('show');
   };

   let conversation = [];
   const saveConversation = () => save(`chatHistory-${chatId}`, conversation),
    renderMarkdown = t => marked.parse(t),
    addMessage = (c, s) => {
     const h = Array.isArray(c) ? c.reduce((a, x) => a + (x.type === 'text' ? (s === 'openai' ? renderMarkdown(x.text) : x.text) : `<img src="${x.image_url.url}" style="max-width:100%;max-height:300px;display:block;margin-top:5px;border-radius:8px">`), '') : s === 'openai' ? renderMarkdown(c) : c;
     chatMessages.insertAdjacentHTML('beforeend', `<div class="message ${s}"><span>${h}</span></div>`);
     chatMessages.lastChild.scrollIntoView({block: 'end'});
    },
    resolveImgs = async (content) => {
     if (!Array.isArray(content)) return content;
     return Promise.all(content.map(async x => {
      if (x.type === 'image_url' && x.image_url?.url?.startsWith('imgref:')) {
       const i = await loadImg(x.image_url.url.slice(7));
       return i ? {type: 'image_url', image_url: {url: i}} : x;
      }
      return x;
     }));
    },
    restoreHistory = async () => {
     conversation = await load(`chatHistory-${chatId}`) || [];
     chatMessages.innerHTML = '';
     for (const m of conversation) addMessage(await resolveImgs(m.content), m.role === 'user' ? 'user' : 'openai');
    };
   await restoreHistory();

   const streamOpenAI = async ({urlBase, apiKey, model, conversation, onChunk, onDone, onError}) => {
    try {
     const res = await fetch(`${urlBase}/chat/completions`, {method: 'POST', headers: {'Content-Type': 'application/json',mode: 'cors', Authorization: `Bearer ${apiKey}`}, body: JSON.stringify({model, messages: conversation, stream: true})}),
      reader = res.body.getReader(), decoder = new TextDecoder();
     let buf = '', text = '';
     while (1) {
      const {value, done} = await reader.read(); if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
       if (!l.trim().startsWith('data:')) continue;
       const d = l.slice(5).trim(); if (d === '[DONE]') return onDone(text);
       const delta = JSON.parse(d).choices[0]?.delta?.content;
       if (delta) { text += delta; onChunk(text); }
      }
     }
    } catch { onError?.(); }
   };

   const prepareConversation = async () => {
    const s = systemPromptInput.value.trim(), b = [];
    for (const m of conversation) b.push({...m, content: await resolveImgs(m.content)});
    return s && b[0]?.role !== 'system' ? [{role: 'system', content: s}, ...b] : b;
   };

   let msgCnt = 0;
   chatForm.onsubmit = async e => {
    e.preventDefault();
    const t = userInput.value; if (!t.trim() && !imgPreview.src) return;
    isSettingTitle = t.startsWith('--set-title');
    let imgRef = null, imgData = null;
    if (imgPreview.src) {
     imgData = imgPreview.src;
     const id = 'img-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
     await saveImg(id, imgData); imgRef = 'imgref:' + id;
    }
    const userMsg = imgRef ? {role: 'user', content: [{type: 'text', text: t || 'Analyze image'}, {type: 'image_url', image_url: {url: imgRef}}]} : {role: 'user', content: t},
     displayContent = imgData ? [{type: 'text', text: t || 'Analyze image'}, {type: 'image_url', image_url: {url: imgData}}] : t;
    addMessage(displayContent, 'user');
    userInput.value = '';
    // BUGFIX: Resetear estado de imagen INMEDIATAMENTE después de enviar
    imgPreview.src = ''; // Limpiar src de la imagen
    imagePreview.style.display = 'none'; // Ocultar preview
    conversation.push(userMsg); await saveConversation();
    const cfg = await load(configKey) || {}, conv = await prepareConversation();
    const rid = `r${++msgCnt}`; addMessage(`<span id="${rid}"></span>`, 'openai');
    const rEl = $(rid), mDiv = chatMessages.lastChild;
    await streamOpenAI({
     urlBase: cfg.urlBase || 'https://api.openai.com/v1', apiKey: cfg.apiKey || '', model: cfg.model || 'gpt-4o-mini', conversation: conv,
     onChunk: c => { rEl.innerHTML = renderMarkdown(c); mDiv.scrollIntoView({block: 'end'}); },
     onDone: async c => {
      if (c) { conversation.push({role: 'assistant', content: c}); await saveConversation(); }
      rEl.innerHTML = renderMarkdown(c);
      if (isSettingTitle) {
       const ti = (c || '').trim().replace(/\r?\n/g, ' ').replace(/[^\p{L}\p{N}\p{Extended_Pictographic} \-]/gu, '').trim().slice(0, 50) || 'New Chat';
       document.title = ti; headerTitle.innerHTML = `${ti}<small class="text-secondary">Streaming Markdown</small><span class="chat-id-tag">${chatId}</span>`;
       save(`chatTitle-${chatId}`, ti); isSettingTitle = false;
      }
     },
     onError: () => { chatMessages.lastChild.remove(); addMessage('Error.', 'openai'); }
    });
   };

   (async () => {
    const ti = await load(`chatTitle-${chatId}`); if (ti) { document.title = ti; headerTitle.innerHTML = `${ti}<small class="text-secondary">Streaming Markdown</small><span class="chat-id-tag">${chatId}</span>`; }
    newChatBtn.onclick = () => {
     const nid = crypto.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
     save(`chatConfig-${nid}`, {urlBase: urlBaseInput.value, apiKey: apiKeyInput.value, model: modelInput.value, systemPrompt: systemPromptInput.value});
     window.open(`?chat=${nid}`, '_blank');
    };
    const d = await openDB(), tx = d.transaction('data', 'readonly'), o = tx.objectStore('data'), keys = await new Promise(r => { const req = o.getAllKeys(); req.onsuccess = () => r(req.result); });
    const chatIds = new Set(); keys.forEach(k => { if (k.startsWith('chatHistory-')) chatIds.add(k.slice(12)); else if (k.startsWith('chatTitle-')) chatIds.add(k.slice(10)); else if (k.startsWith('chatConfig-')) chatIds.add(k.slice(11)); });
    for (const id of chatIds) {
     const t = await load(`chatTitle-${id}`) || 'Untitled', c = await load(`chatConfig-${id}`) || {}, m = c.model || '';
     chatHistorySelect.insertAdjacentHTML('beforeend', `<option value="${id}">${t}(${m})</option>`);
    }
   })();
   chatHistorySelect.onchange = e => { if (e.target.value) location.search = '?chat=' + e.target.value; };
   userInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatForm.requestSubmit(); } };
  </script>
 </body>
</html>
